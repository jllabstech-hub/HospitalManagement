# Optional isolated PostgreSQL for machines without a local server.
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d
#   UNIT_TEST_DATABASE_URL=postgresql://hospital:hospital_test@127.0.0.1:55432/hospital_unit?schema=public
#   E2E_DATABASE_URL=postgresql://hospital:hospital_test@127.0.0.1:55432/hospital_e2e?schema=public
services:
  hospital-test-pg:
    image: postgres:16-alpine
    ports:
      - '55432:5432'
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital_test
      POSTGRES_DB: hospital_unit
    volumes:
      - ./scripts/init-test-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hospital -d hospital_unit']
      interval: 3s
      timeout: 5s
      retries: 20
